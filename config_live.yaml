# Configuration of the live / paper-trading tool (apps/cli.py).
# Research scripts use config.yaml / config_ftse.yaml instead.
# Secrets (Alpaca keys) live in .env, never here.

data:
  provider: alpaca
  feed: sip            # sip: all US venues, 15-min delayed on the free plan | iex: real-time, ~2-3% of volume
  adjustment: all      # prices adjusted for splits and dividends
  cache_dir: data/cache
  overlap_bars: 5      # bars re-downloaded on each update to detect re-adjusted history
  timeframes: [1Day]
  intraday_session: regular   # intraday bars 09:30-16:00 ET only
  intraday_workers: 4         # parallel download tasks (symbol x year)
  history_start:
    1Day: "2016-01-01"
    15Min: "2021-01-01"
    5Min: "2020-01-01"
    1Min: "2020-01-01"   # ETFs only (intraday research); stocks get targeted 1-min fetches

universe:
  mode: screen         # screen: liquidity screen over the asset pool | static: trade exactly `symbols`
  symbols: []          # used only in static mode
  pool:
    exchanges: [NYSE, NASDAQ]   # ETFs, funds, warrants, preferreds, SPACs are filtered out by name
  screen:
    top_n: 100         # universe size
    min_price: 5.0     # USD, last close
    lookback: 60       # sessions for the median dollar volume
    min_bars: 50       # bars required within the lookback (drops halted / sparse names)
    min_history: 200   # total bars required (MA200 agent)
    keep_buffer: 1.25  # members stay while ranked <= top_n * keep_buffer (less turnover)
    rebalance: monthly # snapshot at each month-end close, effective next session
  exit_policy: hold_until_sell_signal   # or force_exit: sell when a stock leaves the universe

benchmark: SPY

logging:
  level: INFO
  file: state/logs/tool.log

state:
  db: state/tool.db
