  caveats:
  - ~470 configurations were examined over 8 research rounds; the US test window 2023-2026
    was viewed repeatedly.
  - 'Deflated Sharpe ratio of the closely related blend ~0.7 (< 0.95): not statistically
    proven.'
  - Asset pool = currently listed stocks (survivorship bias); WIG20/FTSE checks used
    current constituents.
  - Quality filter only verifiable on US data (no SEC filings for WIG20/FTSE); foreign
    IFRS filers get no score and are excluded.
  - Returns are below the index in strong bull markets by design (lower exposure to
    volatile large caps).
