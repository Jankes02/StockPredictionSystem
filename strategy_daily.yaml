# Daily strategy frozen after research rounds 1-8 (see docs/practical_tool/daily_strategy_research.md).
# Change it by re-running the research, not by hand.
name: daily_lowvol_quality_blend
sleeves:
- weight: 0.5
  strategy:
    name: lowvol_quality_ensemble
    type: ensemble
    momentum:
      lookback: 252
      skip: 21
      vol_adjusted: false
      require_positive: true
    mean_reversion:
      rsi_period: 2
      entry_rsi: 10.0
      exit_rsi: 70.0
      trend_window: 200
      exit_sma: 5
    trend_timing:
      window: 200
    fundamental:
      score: quality_value
    pead:
      sue_threshold: 2.0
    agents:
      macd:
        fast_period: 8
        slow_period: 17
        signal_period: 9
        confidence_scale: 5
      rsi:
        period: 14
      roc:
        period: 10
        threshold: 0.02
      bollinger:
        window: 20
        std_mult: 2
      matrend:
        fast: 50
        slow: 200
    decision:
      mode: aggressive
      min_confidence: 0.0
      kind_weights: null
    portfolio:
      sizing: equity
      position_size: 0.1
      max_positions: 10
      max_gross_exposure: 1.0
    costs:
      commission_bps: 0.0
      slippage_bps: 5.0
      stamp_duty_bps: 0.0
    execution:
      fill: next_open
      buy_priority: score
    exits:
      score_below: null
      trailing_stop: null
      max_holding_days: null
    regime:
      enabled: false
      ma_days: 200
      min_votes: 0.5
      action: block_buys
    vol_target:
      enabled: true
      target_vol: 0.2
      window: 20
      trim_band: 0.1
    universe:
      max_volatility: null
      rank_by: low_volatility
      prefilter_top_n: null
      prefilter_skip: null
      quality_keep: 0.5
      quality_kind: quality
      static_symbols: null
    calibration: null
