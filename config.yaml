data:
  daily_dir: "data/daily"

# WIG20 symbols (WSE)
symbols:
  - ALE
  - ALR
  - BDX
  - CDR
  - DNP
  - KGH
  - KRU
  - KTY
  - LPP
  - MBK
  - MDV
  - OPL
  - PCO
  - PEO
  - PGE
  - PKN
  - PKO
  - PZU
  - SPL

backtest:
  initial_cash: 100000
  data_frequency: "daily"   # daily

portfolio:
  position_size: 0.1   # fraction of cash per new position

costs:
  commission_bps: 39   # per-trade commission in basis points (typical WSE retail)
  slippage_bps: 5      # one-way price slippage in basis points

evaluation:
  mode: "walk_forward"    # in_sample | walk_forward
  train_end: "2024-06-30" # anchored split: last date included in train
  folds: 3                # number of folds for the K-fold anchored walk-forward appendix

decision:
  mode: "aggressive"    # passive | balanced | aggressive
  min_confidence: 0.1
  max_positions: null

agents:
  macd: { fast_period: 8, slow_period: 17, signal_period: 9, confidence_scale: 5 }
  rsi: { period: 14 }
  roc: { period: 10, threshold: 0.02 }
  bollinger: { window: 20, std_mult: 2 }
  matrend: { fast: 50, slow: 200 }
